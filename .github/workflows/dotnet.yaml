name: C# Linter

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Run code analysis
      run: find . -name '*.cs' -exec dotnet build {} \;

    - name: Check formatting
      run: find . -name '*.cs' -exec dotnet format {} \;
